name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml==6.0.3
      - run: python -m unittest discover -s tests -v
      - run: python pipeguard/scripts/pipeguard_scan.py examples --hosting github --fail-on none
