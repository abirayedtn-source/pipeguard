trigger:
- main
pr: none
pool:
  vmImage: ubuntu-latest

stages:
- stage: Production
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: Web
    environment: production
    timeoutInMinutes: 20
    strategy:
      runOnce:
        deploy:
          steps:
          - script: echo deploy
