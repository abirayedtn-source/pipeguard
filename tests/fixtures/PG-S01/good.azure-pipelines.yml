trigger:
- main
pr: none
pool:
  vmImage: ubuntu-latest

variables:
- group: app-secrets
- name: keyVaultName
  value: kv-app-prod
- name: clientId
  value: 3f2a9c1e-5b7d-4e8a-9c21-7d4e5f6a8b90
steps:
- task: NuGetCommand@2
  inputs:
    command: restore
    publishFeedCredentials: 'NuGet.org'
- script: ./run.sh
  env:
    SQL_PASSWORD: $(sqlPassword)
